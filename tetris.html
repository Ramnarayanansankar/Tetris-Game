<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tetris Game</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(135deg, #0f172a, #111827);
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: white;
        overflow: hidden;
    }

    .game-container {
        display: flex;
        gap: 24px;
        align-items: center;
        background: rgba(255,255,255,0.05);
        padding: 20px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    canvas {
        background: #0b1020;
        border: 4px solid #334155;
        border-radius: 10px;
    }

    .sidebar {
        width: 220px;
    }

    h1 {
        margin-bottom: 20px;
        font-size: 2rem;
        text-align: center;
    }

    .panel {
        background: rgba(255,255,255,0.08);
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 15px;
    }

    .panel h2 {
        font-size: 1rem;
        margin-bottom: 10px;
        color: #93c5fd;
    }

    .score {
        font-size: 1.6rem;
        font-weight: bold;
    }

    .controls p {
        margin: 8px 0;
        font-size: 0.95rem;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #1d4ed8;
    }

    .game-over {
        color: #f87171;
        font-size: 1.3rem;
        font-weight: bold;
        text-align: center;
        margin-top: 10px;
        display: none;
    }

    @media (max-width: 768px) {
        .game-container {
            flex-direction: column;
        }

        .sidebar {
            width: 100%;
        }
    }
</style>
</head>
<body>

<div class="game-container">
    <canvas id="game" width="300" height="600"></canvas>

    <div class="sidebar">
        <h1>Tetris</h1>

        <div class="panel">
            <h2>Score</h2>
            <div class="score" id="score">0</div>
        </div>

        <div class="panel">
            <h2>Level</h2>
            <div class="score" id="level">1</div>
        </div>

        <div class="panel controls">
            <h2>Controls</h2>
            <p>⬅️ Move Left</p>
            <p>➡️ Move Right</p>
            <p>⬇️ Soft Drop</p>
            <p>⬆️ Rotate</p>
            <p>Space = Hard Drop</p>
            <p>P = Pause</p>
        </div>

        <button id="restartBtn">Restart Game</button>

        <div class="game-over" id="gameOver">
            GAME OVER
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const ROWS = 20;
const COLS = 10;
const BLOCK_SIZE = 30;

const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const gameOverEl = document.getElementById('gameOver');
const restartBtn = document.getElementById('restartBtn');

ctx.scale(BLOCK_SIZE, BLOCK_SIZE);

const COLORS = [
    null,
    '#00f0f0',
    '#0000f0',
    '#f0a000',
    '#f0f000',
    '#00f000',
    '#a000f0',
    '#f00000'
];

const SHAPES = [
    [],
    [[1,1,1,1]],
    [[2,0,0],[2,2,2]],
    [[0,0,3],[3,3,3]],
    [[4,4],[4,4]],
    [[0,5,5],[5,5,0]],
    [[0,6,0],[6,6,6]],
    [[7,7,0],[0,7,7]]
];

function createBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
}

let board = createBoard();

function randomPiece() {
    const typeId = Math.floor(Math.random() * 7) + 1;
    const shape = SHAPES[typeId];

    return {
        x: Math.floor(COLS / 2) - Math.ceil(shape[0].length / 2),
        y: 0,
        shape,
        color: typeId
    };
}

let piece = randomPiece();
let score = 0;
let level = 1;
let lines = 0;
let dropCounter = 0;
let lastTime = 0;
let gameOver = false;
let paused = false;

function drawCell(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, 1, 1);

    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 0.05;
    ctx.strokeRect(x, y, 1, 1);
}

function drawBoard() {
    board.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                drawCell(x, y, COLORS[value]);
            }
        });
    });
}

function drawPiece() {
    piece.shape.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                drawCell(piece.x + x, piece.y + y, COLORS[piece.color]);
            }
        });
    });
}

function draw() {
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawBoard();
    drawPiece();
}

function collide() {
    for (let y = 0; y < piece.shape.length; y++) {
        for (let x = 0; x < piece.shape[y].length; x++) {
            if (
                piece.shape[y][x] !== 0 &&
                (
                    board[y + piece.y] === undefined ||
                    board[y + piece.y][x + piece.x] === undefined ||
                    board[y + piece.y][x + piece.x] !== 0
                )
            ) {
                return true;
            }
        }
    }

    return false;
}

function merge() {
    piece.shape.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                board[y + piece.y][x + piece.x] = piece.color;
            }
        });
    });
}

function rotate(matrix) {
    return matrix[0].map((_, i) =>
        matrix.map(row => row[i]).reverse()
    );
}

function rotatePiece() {
    const original = piece.shape;
    piece.shape = rotate(piece.shape);

    if (collide()) {
        piece.shape = original;
    }
}

function clearLines() {
    let cleared = 0;

    outer:
    for (let y = ROWS - 1; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) {
            if (board[y][x] === 0) {
                continue outer;
            }
        }

        const row = board.splice(y, 1)[0].fill(0);
        board.unshift(row);
        cleared++;
        y++;
    }

    if (cleared > 0) {
        const points = [0, 100, 300, 500, 800];
        score += points[cleared] * level;
        lines += cleared;

        level = Math.floor(lines / 10) + 1;

        scoreEl.textContent = score;
        levelEl.textContent = level;
    }
}

function resetPiece() {
    piece = randomPiece();

    if (collide()) {
        gameOver = true;
        gameOverEl.style.display = 'block';
    }
}

function drop() {
    piece.y++;

    if (collide()) {
        piece.y--;
        merge();
        clearLines();
        resetPiece();
    }

    dropCounter = 0;
}

function hardDrop() {
    while (!collide()) {
        piece.y++;
    }

    piece.y--;
    merge();
    clearLines();
    resetPiece();
}

function update(time = 0) {
    if (gameOver || paused) {
        draw();
        requestAnimationFrame(update);
        return;
    }

    const delta = time - lastTime;
    lastTime = time;
    dropCounter += delta;

    const speed = Math.max(100, 1000 - (level - 1) * 100);

    if (dropCounter > speed) {
        drop();
    }

    draw();
    requestAnimationFrame(update);
}

function move(dir) {
    piece.x += dir;

    if (collide()) {
        piece.x -= dir;
    }
}

document.addEventListener('keydown', e => {
    if (gameOver) return;

    if (e.key === 'ArrowLeft') {
        move(-1);
    }
    else if (e.key === 'ArrowRight') {
        move(1);
    }
    else if (e.key === 'ArrowDown') {
        drop();
    }
    else if (e.key === 'ArrowUp') {
        rotatePiece();
    }
    else if (e.code === 'Space') {
        hardDrop();
    }
    else if (e.key.toLowerCase() === 'p') {
        paused = !paused;
    }
});

restartBtn.addEventListener('click', () => {
    board = createBoard();
    piece = randomPiece();
    score = 0;
    level = 1;
    lines = 0;
    gameOver = false;
    paused = false;

    scoreEl.textContent = score;
    levelEl.textContent = level;
    gameOverEl.style.display = 'none';
});

update();
</script>

</body>
</html>
